services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nostroq
      POSTGRES_PASSWORD: nostroq
      POSTGRES_DB: nostroq
    ports:
      - "5432:5432"
    volumes:
      - nostroq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostroq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Provisioned for future async job scaling. Not required by the current
    # synchronous, demo-scale optimization path - see docs/limitations.md.

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://nostroq:nostroq@postgres:5432/nostroq
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-CHANGE-ME-before-any-real-deployment}
      ENV: production
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  nostroq_pg_data:
