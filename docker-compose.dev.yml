# Development overlay: hot-reload for both services.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.seed.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dev.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    ports:
      - "5173:5173"
